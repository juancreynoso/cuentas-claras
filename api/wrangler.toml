name = "cuentas-claras"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Un solo Worker sirve el SPA y la API. Same-origin: sin CORS, sin preflight,
# un solo deploy y un solo dominio.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Las rutas /api/* las maneja el Worker; el resto lo resuelven los assets.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cuentas-claras-db"
database_id = "873f85fb-d22c-4946-8207-2423be91120f"

[observability]
enabled = true

# Limpieza semanal de grupos abandonados (domingos 03:00 UTC). Ver el handler
# `scheduled` en src/index.ts y la sección "Retención de datos" del README.
#
# El día va como SUN y no como número: en Cloudflare la semana es 1-7 con
# 1 = domingo, no el 0-6 del cron estándar. Un "0" acá es un error de API,
# y un "1" se leería como lunes viniendo de cualquier otro sistema.
[triggers]
crons = ["0 3 * * SUN"]

# SESSION_SECRET es un secreto, NO una var. Configurarlo con:
#   wrangler secret put SESSION_SECRET
# En local va en api/.dev.vars (ignorado por git).
